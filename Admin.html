<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}

.topbar {
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.card {
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td {
  border:1px solid #333;
  padding:10px;
}

th { background:#222; }

tr:nth-child(even) { background:#1a1a1a; }

select {
  padding:5px;
  border-radius:5px;
}

/* POPUP */
.popup {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.popup-box {
  background:#222;
  padding:20px;
  width:420px;
  border-radius:10px;
}

.close {
  float:right;
  cursor:pointer;
  color:red;
}

.item-row {
  margin:8px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button {
  cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="card">📦 Orders: <span id="orderCount">0</span></div>
  <div class="card">💰 Revenue: $<span id="revenue">0</span></div>
</div>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Date</th>
      <th>Name</th>
      <th>Total</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="ordersTable"></tbody>
</table>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <span class="close" onclick="closePopup()">X</span>
    <h3>Order Items</h3>
    <div id="itemsBox"></div>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec";

let lastCount = 0;
const sound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

let currentItems = [];


// ================= LOAD ORDERS =================
function loadOrders() {

  fetch(API_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(data => {

      let html = "";
      let revenue = 0;

      if (lastCount && data.length > lastCount) {
        sound.play();
      }
      lastCount = data.length;

      document.getElementById("orderCount").innerText = data.length;

      data.reverse().forEach(order => {

        revenue += Number(order.Total || 0);

        html += `
          <tr>
            <td onclick="openOrder('${order["Order ID"]}')" style="cursor:pointer; text-decoration:underline;">
              ${order["Order ID"]}
            </td>

            <td>${order.Date}</td>
            <td>${order.Name}</td>
            <td>$${order.Total}</td>

            <td>
              <select onchange="updateStatus('${order["Order ID"]}', this.value)">
                <option ${order.Status==="Pending"?"selected":""}>Pending</option>
                <option ${order.Status==="Shipped"?"selected":""}>Shipped</option>
                <option ${order.Status==="Done"?"selected":""}>Done</option>
              </select>
            </td>
          </tr>
        `;
      });

      document.getElementById("ordersTable").innerHTML = html;
      document.getElementById("revenue").innerText = revenue;

    });
}


// ================= UPDATE ORDER STATUS =================
function updateStatus(orderId, status) {

  fetch(API_URL + "?action=updateStatus", {
    method:"POST",
    body: JSON.stringify({ orderId, status })
  }).then(()=>loadOrders());
}


// ================= OPEN ORDER ITEMS =================
function openOrder(orderId) {

  fetch(API_URL + "?action=items&t=" + Date.now())
    .then(res => res.json())
    .then(items => {

      currentItems = items.filter(i => i["Order ID"] === orderId);

      let html = "";

      currentItems.forEach(i => {

        html += `
          <div class="item-row">
            <label>
              <input type="checkbox"
                onchange="toggleItem('${i["Order ID"]}','${i.Item}',this.checked)"
                ${i.Status==="Done"?"checked":""}>
              ${i.Item} (${i.Color}) x${i.Qty}
            </label>
          </div>
        `;
      });

      document.getElementById("itemsBox").innerHTML = html;
      document.getElementById("popup").style.display = "flex";
    });
}


// ================= ITEM TOGGLE =================
function toggleItem(orderId, item, checked) {

  fetch(API_URL, {
    method:"POST",
    body: JSON.stringify({
      action:"updateItem",
      orderId,
      item,
      status: checked ? "Done" : "Pending"
    })
  })
  .then(()=>checkOrderComplete(orderId));
}


// ================= AUTO COMPLETE ORDER =================
function checkOrderComplete(orderId) {

  fetch(API_URL + "?action=items")
    .then(res => res.json())
    .then(items => {

      const list = items.filter(i => i["Order ID"] === orderId);

      const allDone = list.every(i => i.Status === "Done");

      if (allDone) {
        updateStatus(orderId, "Done");
      }
    });
}


// ================= POPUP CLOSE =================
function closePopup() {
  document.getElementById("popup").style.display = "none";
}


// ================= AUTO REFRESH =================
window.onload = () => {
  loadOrders();
  setInterval(loadOrders, 10000);
};

</script>

</body>
</html>
