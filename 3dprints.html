<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Printing Services</title>

  <style>
    :root {
      --bg-color: #000;
      --text-color: #fff;
      --card-bg: #111;
      --button-bg: #28a745;
      --button-hover: #1e7e34;
      --header-bg: #222;
      --dropdown-bg: #333;
      --dropdown-hover: #444;
    }

    .light-theme {
      --bg-color: #ffffff;
      --text-color: #000;
      --card-bg: #f9f9f9;
      --button-bg: #007bff;
      --button-hover: #0056b3;
      --header-bg: #f0f0f0;
      --dropdown-bg: #fff;
      --dropdown-hover: #e0e0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background: var(--header-bg);
      padding: 1.5rem 1rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-section {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: var(--dropdown-bg);
      min-width: 180px;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-content a {
      display: block;
      padding: 10px;
      color: var(--text-color);
      text-decoration: none;
    }

    .dropdown-content a:hover {
      background: var(--dropdown-hover);
    }

    #themeToggle {
      background: none;
      border: 1px solid var(--text-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 3rem 1rem;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 10px;
      text-align: center;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    /* ✅ FIXED IMAGE (NO CROPPING) */
    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: var(--card-bg);
      padding: 10px;
      cursor: pointer;
    }

    .price {
      font-weight: bold;
      margin: 1rem 0;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: var(--header-bg);
    }

    /* ================= LIGHTBOX ================= */

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .lightbox .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <div class="header-container">
    <div class="nav-section">
      <a href="index.html">Home</a>
    </div>

    <button id="themeToggle">Toggle Theme</button>
  </div>
</header>

<section class="hero">
  <h1>3D Printing Services</h1>
</section>

<section class="products">

  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg" alt="">
    <h3>Disney Ear Wall Mount</h3>
    <div class="price">$6</div>
  </div>

  <div class="product-card">
    <img src="Images/Lithophane.jpeg" alt="">
    <h3>Lithophane</h3>
    <div class="price">$60+</div>
  </div>

  <div class="product-card">
    <img src="Images/Tap To Pay Star.jpeg" alt="">
    <h3>Tap To Pay Star</h3>
    <div class="price">$10</div>
  </div>

</section>

<footer>
  © 2025 Reliatech
</footer>

<!-- ✅ LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <img id="lightbox-img" src="">
</div>

<script>
  // theme toggle
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('light-theme');
  });

  // lightbox logic
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const closeBtn = document.querySelector(".lightbox .close");

  document.querySelectorAll(".product-card img").forEach(img => {
    img.addEventListener("click", () => {
      lightbox.style.display = "flex";
      lightboxImg.src = img.src;
    });
  });

  closeBtn.addEventListener("click", () => {
    lightbox.style.display = "none";
  });

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.style.display = "none";
    }
  });
</script>

</body>
</html>
