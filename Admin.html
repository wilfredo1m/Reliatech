<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}

/* TOP BAR */
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.card {
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td {
  border:1px solid #333;
  padding:10px;
}

th { background:#222; }

tr:nth-child(even) { background:#1a1a1a; }

/* STATUS */
select {
  padding:5px;
  border-radius:5px;
}

/* POPUP */
.popup {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.popup-content {
  background:#222;
  padding:20px;
  width:400px;
  border-radius:10px;
}

.close {
  float:right;
  cursor:pointer;
  color:red;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="card">📦 Orders: <span id="orderCount">0</span></div>
  <div class="card">💰 Revenue: $<span id="revenue">0</span></div>
</div>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Date</th>
      <th>Name</th>
      <th>Total</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="ordersTable"></tbody>
</table>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">X</span>
    <h3>Order Items</h3>
    <div id="popupItems"></div>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec";

let lastOrderCount = 0;

const sound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");


// ================= LOAD ORDERS =================
function loadOrders() {
  fetch(API_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(data => {

      let html = "";
      let revenue = 0;

      // NEW ORDER ALERT
      if (lastOrderCount && data.length > lastOrderCount) {
        sound.play();
      }
      lastOrderCount = data.length;

      document.getElementById("orderCount").innerText = data.length;

      data.reverse().forEach(order => {

        revenue += Number(order["Total"] || 0);

        html += `
          <tr>
            <td onclick="viewOrder('${order["Order ID"]}')"
                style="cursor:pointer; text-decoration:underline;">
              ${order["Order ID"]}
            </td>

            <td>${order["Date"]}</td>
            <td>${order["Name"]}</td>
            <td>$${order["Total"]}</td>

            <td>
              <select onchange="updateStatus('${order["Order ID"]}', this.value)">
                <option ${order["Status"]=="Pending"?"selected":""}>Pending</option>
                <option ${order["Status"]=="Shipped"?"selected":""}>Shipped</option>
                <option ${order["Status"]=="Done"?"selected":""}>Done</option>
              </select>
            </td>
          </tr>
        `;
      });

      document.getElementById("ordersTable").innerHTML = html;
      document.getElementById("revenue").innerText = revenue;

    });
}


// ================= STATUS UPDATE =================
function updateStatus(orderId, status) {
  fetch(API_URL + "?action=updateStatus", {
    method: "POST",
    body: JSON.stringify({
      orderId,
      status
    })
  }).then(() => loadOrders());
}


// ================= VIEW ITEMS POPUP =================
function viewOrder(orderId) {

  fetch(API_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(orders => {

      const order = orders.find(o => o["Order ID"] === orderId);

      if (!order) return;

      document.getElementById("popupItems").innerHTML = `
        <p><b>Name:</b> ${order.Name}</p>
        <p><b>Email:</b> ${order.Email}</p>
        <p><b>Total:</b> $${order.Total}</p>
      `;

      document.getElementById("popup").style.display = "flex";
    });
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}


// ================= AUTO REFRESH =================
window.onload = () => {
  loadOrders();
  setInterval(loadOrders, 10000);
};

</script>

</body>
</html>
