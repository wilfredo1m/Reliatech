<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#111;
  --btn:#28a745;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER (RESTORED EXACT STYLE) ================= */

header {
  background: var(--header-bg, #222);
  color: var(--text-color, #fff);
  padding: 1.5rem 1rem;
  transition: padding 0.3s ease;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto;
}

.nav-section {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.logo-link {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.center-image img {
  height: 80px;
}

/* ================= GRID ================= */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.5rem;
  padding:2rem;
}

.product-card{
  background:var(--card);
  border-radius:10px;
  text-align:center;
  padding-bottom:1rem;
}

.product-card img{
  width:100%;
  height:240px;
  object-fit:contain;
  background:#000;
  padding:10px;
  cursor:zoom-in;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.qty,.color{
  width:70px;
}

.order-btn{
  background:var(--btn);
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}

/* ================= CART BUTTON ================= */

.cart-button{
  position:fixed;
  top:20px;
  right:20px;
  background:#28a745;
  padding:10px 14px;
  border-radius:50px;
  cursor:pointer;
  z-index:10000;
  font-weight:bold;
}

/* ================= DRAWER ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:9998;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-360px;
  width:340px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s ease;
  z-index:9999;
  overflow-y:auto;
}

.cart-drawer.open{right:0;}
.overlay.show{display:block;}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  cursor:pointer;
  font-size:20px;
}

/* CART ITEMS */
.cart-item{
  border-bottom:1px solid #333;
  padding:10px 0;
}

.qty-controls{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:5px;
}

.qty-btn{
  background:#333;
  color:white;
  border:none;
  padding:2px 8px;
  cursor:pointer;
}

.remove{
  color:red;
  cursor:pointer;
  margin-top:5px;
  display:inline-block;
}

/* FOOTER */
.cart-footer{
  position:absolute;
  bottom:20px;
  width:90%;
}

#checkoutBtn{
  width:100%;
  padding:10px;
  background:green;
  border:none;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- ================= HEADER (UNCHANGED STRUCTURE) ================= -->
<header id="header">
  <div class="header-container">

    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>

      <div class="dropdown">
        <span>Service Types ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <a href="index.html">
        <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png">
      </a>
    </div>

    <div class="nav-section">
      <div class="dropdown">
        <span>More ▾</span>
        <div class="dropdown-content">
          <a href="about-us.html">About Us</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </div>

  </div>
</header>

<!-- PRODUCTS -->
<section class="products">

  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Ear Mount</h3>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>

      <button class="order-btn" data-name="Ear Mount" data-price="6">Add</button>
    </div>
  </div>

  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <button class="order-btn" data-name="Lithophane" data-price="60">Add</button>
    </div>
  </div>

</section>

<!-- CART -->
<div class="cart-button" id="cartBtn">🛒 <span id="count">0</span></div>
<div class="overlay" id="overlay"></div>

<div class="cart-drawer" id="drawer">

  <div class="cart-header">
    <h3>Cart</h3>
    <span class="close" id="close">✕</span>
  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <p>Total: $<span id="total">0</span></p>
    <button id="checkoutBtn">Checkout</button>
  </div>

</div>

<script>

let cart=[];

/* OPEN/CLOSE */
const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");

document.getElementById("cartBtn").onclick=()=>{
  drawer.classList.add("open");
  overlay.classList.add("show");
};

document.getElementById("close").onclick=close;
overlay.onclick=close;

function close(){
  drawer.classList.remove("open");
  overlay.classList.remove("show");
}

/* ADD */
document.querySelectorAll(".order-btn").forEach(btn=>{
  btn.onclick=()=>{
    cart.push({
      name:btn.dataset.name,
      price:+btn.dataset.price,
      qty:+btn.parentElement.querySelector(".qty").value,
      color:btn.parentElement.querySelector(".color")?.value || "N/A"
    });
    update();
  };
});

/* UPDATE */
function update(){

  let box=document.getElementById("cart-items");
  let total=0;

  box.innerHTML="";

  cart.forEach((item,i)=>{

    let itemTotal=item.price*item.qty;
    total+=itemTotal;

    box.innerHTML+=`
      <div class="cart-item">
        <p><b>${item.name}</b></p>
        <p>${item.color}</p>

        <div class="qty-controls">
          <button class="qty-btn" onclick="dec(${i})">-</button>
          <span>${item.qty}</span>
          <button class="qty-btn" onclick="inc(${i})">+</button>
        </div>

        <span class="remove" onclick="removeItem(${i})">Remove</span>

        <p>$${itemTotal.toFixed(2)}</p>
      </div>
    `;
  });

  document.getElementById("total").innerText=total.toFixed(2);
  document.getElementById("count").innerText=cart.length;
}

/* CART CONTROLS */
function inc(i){
  cart[i].qty++;
  update();
}

function dec(i){
  if(cart[i].qty>1){
    cart[i].qty--;
    update();
  }
}

function removeItem(i){
  cart.splice(i,1);
  update();
}

</script>

</body>
</html>
