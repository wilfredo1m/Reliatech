<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>

/* ================= THEME ================= */

:root {
  --bg-color:#000;
  --text-color:#fff;
  --card-bg:#111;
  --button-bg:#28a745;
  --button-hover:#1e7e34;
  --header-bg:#222;
  --dropdown-bg:#333;
  --dropdown-hover:#444;
}

body.light-theme {
  --bg-color:#fff;
  --text-color:#000;
  --card-bg:#f4f4f4;
  --button-bg:#007bff;
  --button-hover:#0056b3;
  --header-bg:#f0f0f0;
  --dropdown-bg:#fff;
  --dropdown-hover:#e6e6e6;
}

body {
  margin:0;
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  transition:0.3s ease;
}

/* ================= HEADER (UNCHANGED STRUCTURE) ================= */

header {
  background:var(--header-bg);
  color:var(--text-color);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-container {
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.nav-section {
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo-link {
  color:var(--text-color);
  text-decoration:none;
  font-weight:bold;
}

/* ================= DROPDOWNS (RESTORED) ================= */

.dropdown {
  position:relative;
  cursor:pointer;
}

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  left:0;
  background:var(--dropdown-bg);
  min-width:180px;
  border-radius:4px;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  z-index:2000;
}

.dropdown:hover .dropdown-content {
  display:block;
}

.dropdown-content a {
  display:block;
  padding:10px;
  text-decoration:none;
  color:var(--text-color);
}

.dropdown-content a:hover {
  background:var(--dropdown-hover);
}

.center-image img {
  height:80px;
}

#themeToggle {
  background:none;
  border:1px solid var(--text-color);
  color:var(--text-color);
  padding:0.5rem 1rem;
  cursor:pointer;
}

/* ================= PRODUCTS ================= */

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:2rem;
  padding:2rem;
  max-width:1200px;
  margin:auto;
}

.product-card {
  background:var(--card-bg);
  border-radius:10px;
  text-align:center;
  overflow:hidden;
  padding-bottom:1rem;
}

.product-card img {
  width:100%;
  height:220px;
  object-fit:contain;
  background:#000;
  padding:10px;
  cursor:zoom-in;
}

.product-card h3 {
  margin:0.5rem 0;
}

.product-card p {
  font-size:0.9rem;
  opacity:0.85;
  padding:0 10px;
}

/* ================= CONTROLS ================= */

.controls {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.qty, .color {
  width:80px;
}

.order-btn {
  background:var(--button-bg);
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}

/* ================= CART ================= */

.cart-button {
  position:fixed;
  top:20px;
  right:20px;
  background:#28a745;
  padding:10px 14px;
  border-radius:50px;
  cursor:pointer;
  z-index:10000;
}

.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:9998;
}

.cart-drawer {
  position:fixed;
  top:0;
  right:-360px;
  width:340px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:9999;
  overflow-y:auto;
}

.cart-drawer.open { right:0; }
.overlay.show { display:block; }

.cart-item {
  border-bottom:1px solid #333;
  padding:10px 0;
}

.qty-controls {
  display:flex;
  gap:8px;
  align-items:center;
}

.qty-btn {
  background:#333;
  color:#fff;
  border:none;
  padding:2px 8px;
  cursor:pointer;
}

.remove {
  color:red;
  cursor:pointer;
}

/* ================= LIGHTBOX ================= */

.lightbox {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.lightbox img {
  max-width:90%;
  max-height:90%;
}

/* ================= TOAST ================= */

.toast {
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:white;
  padding:10px 16px;
  border-radius:6px;
  opacity:0;
  transition:0.3s;
  z-index:100000;
}

.toast.show { opacity:1; }

  /* spinning animation */
  .spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top: 2px solid #fff;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- ================= HEADER (UNCHANGED) ================= -->
<header>
  <div class="header-container">

    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>

      <div class="dropdown">
        <span>Service Types ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <a href="index.html">
        <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png">
      </a>
    </div>

    <div class="nav-section">
      <div class="dropdown">
        <span>More ▾</span>
        <div class="dropdown-content">
          <a href="about-us.html">About Us</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>

      <button id="themeToggle">Toggle Theme</button>
    </div>

  </div>
</header>

<!-- PRODUCTS -->
<section class="products">

  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Disney Ear Wall Mount</h3>
    <p>Wall-mounted Disney ear display holder.</p>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>
      <button class="order-btn" data-name="Ear Mount" data-price="6">Add</button>
    </div>
  </div>

  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>
    <p>Custom backlit photo lithophanes.</p>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <button class="order-btn" data-name="Lithophane" data-price="60">Add</button>
    </div>
  </div>

  <div class="product-card">
    <img src="Images/Tap To Pay Star.jpeg">
    <h3>Tap To Pay Star</h3>
    <p>Stylized NFC tap-to-pay stand.</p>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>
      <button class="order-btn" data-name="Tap Star" data-price="10">Add</button>
    </div>
  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<!-- CART -->
<div class="cart-button" id="cartBtn">🛒 <span id="count">0</span></div>
<div class="overlay" id="overlay"></div>

<div class="cart-drawer" id="drawer"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CHECKOUT MODAL -->
<div id="checkoutModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100000; justify-content:center; align-items:center;">
  <div style="background:var(--card-bg); padding:20px; border-radius:10px; width:300px; color:var(--text-color);">

    <h3>Checkout</h3>

    <input id="custName" placeholder="Full Name" style="width:100%; margin:5px 0; padding:8px;">
    <input id="custEmail" placeholder="Email" style="width:100%; margin:5px 0; padding:8px;">
    <input id="custPhone" placeholder="Phone Number" style="width:100%; margin:5px 0; padding:8px;">
    <p id="orderStatus" style="margin-top:10px; font-size:0.9rem;"></p>
    <button id="submitBtn" onclick="submitOrder()" style="margin-top:10px; width:100%; padding:10px; background:#28a745; color:white; border:none;">
      Submit Order
    </button>

    <button onclick="closeCheckout()" style="margin-top:5px; width:100%; padding:8px;">
      Cancel
    </button>

  </div>
</div>
  
<script>

/* ================= THEME ================= */
document.getElementById("themeToggle").addEventListener("click", () => {
  document.body.classList.toggle("light-theme");
});

/* ================= LIGHTBOX ================= */
const lightbox=document.getElementById("lightbox");
const lightImg=document.getElementById("lightbox-img");

document.querySelectorAll(".product-card img").forEach(img=>{
  img.onclick=()=>{
    lightbox.style.display="flex";
    lightImg.src=img.src;
  };
});
lightbox.onclick=()=>lightbox.style.display="none";

/* ================= TOAST ================= */
const toast=document.getElementById("toast");
const successSound = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1200);
}

/* ================= CART ================= */
let cart=[];
const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");

document.getElementById("cartBtn").onclick=()=>{
  drawer.classList.add("open");
  overlay.classList.add("show");
};

overlay.onclick=()=>{
  drawer.classList.remove("open");
  overlay.classList.remove("show");
};

/* ADD TO CART */
document.querySelectorAll(".order-btn").forEach(btn=>{
  btn.onclick=()=>{
    cart.push({
      name:btn.dataset.name,
      price:+btn.dataset.price,
      qty:+btn.parentElement.querySelector(".qty").value,
      color:btn.parentElement.querySelector(".color")?.value || "N/A"
    });
    showToast("Added to cart");
    update();
  };
});

/* UPDATE CART UI */
function update(){
  let box=document.getElementById("drawer");
  let total=0;

  box.innerHTML=`
    <h3>Cart</h3>
    <hr>
  `;

  cart.forEach((item,i)=>{
    let t=item.price*item.qty;
    total+=t;

    box.innerHTML+=`
      <div class="cart-item">
        <p><b>${item.name}</b></p>
        <p>Color: ${item.color}</p>

        <div class="qty-controls">
          <button onclick="dec(${i})">-</button>
          <span>${item.qty}</span>
          <button onclick="inc(${i})">+</button>
        </div>

        <p>$${t}</p>
        <span class="remove" onclick="removeItem(${i})">Remove</span>
      </div>
    `;
  });

  box.innerHTML+=`
    <hr>
    <h3>Total: $${total}</h3>
    <button onclick="openCheckout()" style="width:100%; padding:10px; background:#28a745; color:white; border:none;">
      Checkout
    </button>
  `;

  document.getElementById("count").innerText=cart.length;
}

function inc(i){cart[i].qty++;update();}
function dec(i){if(cart[i].qty>1){cart[i].qty--;update();}}
function removeItem(i){cart.splice(i,1);update();}

/* ================= CHECKOUT MODAL ================= */

function openCheckout(){
  document.getElementById("checkoutModal").style.display="flex";
}

function closeCheckout(){
  document.getElementById("checkoutModal").style.display="none";
}

/* ================= SEND TO GOOGLE SHEETS ================= */

function submitOrder(){

  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("orderStatus");

  let name = document.getElementById("custName").value;
  let email = document.getElementById("custEmail").value;
  let phone = document.getElementById("custPhone").value;

  if(!name || !email || !phone){
    alert("Please fill all fields");
    return;
  }

  // 🔒 lock UI immediately
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Processing...`;
  status.style.color = "#ccc";
  status.innerText = "Submitting your order...";

  const order = {
    name,
    email,
    phone,
    items: cart,
    total: cart.reduce((sum,i)=>sum+i.price*i.qty,0)
  };

  // 🚀 auto-close cart immediately (requested)
  drawer.classList.remove("open");
  overlay.classList.remove("show");

  fetch("https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec", {
  method: "POST",
  body: JSON.stringify(order)
})
.then(res => res.json())   // ✅ IMPORTANT CHANGE
.then(data => {

  console.log(data);

  if (data.success) {

    // 🎉 success UI
    status.style.color = "lightgreen";
    status.innerText = `✔ Order received! ID: ${data.orderId}`;

    successSound.play().catch(()=>{}); // 🔊 sound

    cart = [];
    update();

    document.getElementById("custName").value = "";
    document.getElementById("custEmail").value = "";
    document.getElementById("custPhone").value = "";

    btn.innerHTML = "Submit Order";
    btn.disabled = false;

    setTimeout(() => {
      closeCheckout();
      status.innerText = "";
    }, 1200);

  } else {

    status.style.color = "red";
    status.innerText = "Server error: " + data.error;

    btn.innerHTML = "Submit Order";
    btn.disabled = false;
  }

})
.catch(err => {

  console.error(err);

  status.style.color = "red";
  status.innerText = "Network error. Try again.";

  btn.innerHTML = "Submit Order";
  btn.disabled = false;

});

}

</script>

</body>
</html>
