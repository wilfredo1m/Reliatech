<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}

h1 {
  text-align:center;
}

button {
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td {
  border:1px solid #333;
  padding:10px;
  text-align:left;
}

th {
  background:#222;
}

tr:nth-child(even) {
  background:#1a1a1a;
}

.status {
  padding:6px 10px;
  border-radius:5px;
  border:none;
}

.pending {
  background:orange;
  color:black;
}

.done {
  background:green;
  color:white;
}
</style>
</head>

<body>

<h1>📦 Admin Orders Dashboard</h1>

<button onclick="loadOrders()">Refresh</button>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Date</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Total</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="ordersTable"></tbody>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec";

function loadOrders() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {

      let html = "";

      data.reverse().forEach(order => {

        let status = order["Status"] || "Pending";
        let statusClass = status.toLowerCase() === "done" ? "done" : "pending";

        html += `
          <tr>
            <td>${order["Order ID"]}</td>
            <td>${order["Date"]}</td>
            <td>${order["Name"]}</td>
            <td>${order["Email"]}</td>
            <td>${order["Phone"]}</td>
            <td>$${order["Total"]}</td>

            <td>
              <button 
                class="status ${statusClass}"
                onclick="markDone('${order["Order ID"]}')"
              >
                ${status}
              </button>
            </td>
          </tr>
        `;
      });

      document.getElementById("ordersTable").innerHTML = html;
    });
}


// ================= MARK AS DONE =================
function markDone(orderId) {
  fetch(API_URL + "?action=updateStatus", {
    method: "POST",
    body: JSON.stringify({
      orderId: orderId,
      status: "Done"
    })
  })
  .then(res => res.json())
  .then(() => {
    loadOrders(); // refresh table
  });
}

// initial load
loadOrders();

</script>

</body>
</html>
