<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>
/* ================= THEME ================= */
:root {
  --bg-color:#000;
  --text-color:#fff;
  --card-bg:#111;
  --button-bg:#28a745;
  --button-hover:#1e7e34;
  --header-bg:#222;
  --dropdown-bg:#333;
  --dropdown-hover:#444;
}

body.light-theme {
  --bg-color:#fff;
  --text-color:#000;
  --card-bg:#f4f4f4;
  --button-bg:#007bff;
  --button-hover:#0056b3;
  --header-bg:#f0f0f0;
  --dropdown-bg:#fff;
  --dropdown-hover:#e6e6e6;
}

body {
  margin:0;
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  transition:0.3s ease;
}

/* ================= HEADER ================= */
header {
  background:var(--header-bg);
  color:var(--text-color);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-container {
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.nav-section {
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo-link {
  color:var(--text-color);
  text-decoration:none;
  font-weight:bold;
}

/* ================= DROPDOWNS ================= */
.dropdown {
  position:relative;
  cursor:pointer;
}

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  left:0;
  background:var(--dropdown-bg);
  min-width:180px;
  border-radius:4px;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  z-index:2000;
}

.dropdown:hover .dropdown-content {
  display:block;
}

.dropdown-content a {
  display:block;
  padding:10px;
  text-decoration:none;
  color:var(--text-color);
}

.dropdown-content a:hover {
  background:var(--dropdown-hover);
}

.center-image img {
  height:80px;
}

#themeToggle {
  background:none;
  border:1px solid var(--text-color);
  color:var(--text-color);
  padding:0.5rem 1rem;
  cursor:pointer;
}

.shop-hero {
  background:#f1641e;
  color:white;
  text-align:center;
  padding:50px 20px;
}

.shop-hero h1 {
  font-size:3rem;
  margin-bottom:10px;
}

.shop-hero p {
  max-width:700px;
  margin:auto;
  font-size:1.1rem;
}

/* ================= FILTER BAR ================= */
.filter-bar {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  padding:25px;
}

.filter-btn {
  background:#fff;
  color:#222;
  border:none;
  border-radius:30px;
  padding:10px 20px;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}

.filter-btn:hover {
  transform:translateY(-2px);
}

.filter-btn.active {
  background:#f1641e;
  color:white;
}

/* ================= ETSY STYLE PRODUCTS ================= */
.products {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:24px;
  padding:40px;
  max-width:1400px;
  margin:auto;
}

.product-card {
  background:var(--card-bg);
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
  transition:all .25s ease;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
  display: flex;         /* Optimized: Keeps cards stable heights */
  flex-direction: column;
  height: 100%;
}

.product-card:hover {
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.product-card img {
  width:100%;
  height:300px;
  object-fit:cover;
  display:block;
  cursor:zoom-in;
  transition: transform 0.25s ease;
}

.product-card:hover img {
  transform:scale(1.03);
}

.product-info {
  padding:18px;
  display:flex;
          /* Optimized: Dynamic vertical stretching */
  flex-direction:column;
  flex-grow:1;
}

.product-card h3 {
  margin:0;
  font-size:1.25rem;
}

.price {
  color:#f1641e;
  font-size:1.5rem;
  font-weight:700;
  margin-top:8px;
}

.product-card p {
  font-size:0.95rem;
  opacity:0.85;
  line-height:1.5;
  margin-top:10px;
  flex-grow:1;          /* Optimized: Keeps descriptions aligned uniformly */
}

/* ================= CONTROLS ================= */
.controls {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:auto;      /* Optimized: Pins purchase buttons cleanly to bottom */
}

.qty,
.color {
  flex:1;
  min-width:90px;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#222;
  color:#fff;
}

.order-btn {
  width:100%;
  background:#222;
  color:white;
  border:none;
  padding:12px;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.order-btn:hover {
  background:#000;
}

/* ================= CART ================= */
.cart-button {
  position:fixed;
  top:20px;
  right:20px;
  background:#28a745;
  padding:10px 14px;
  border-radius:50px;
  cursor:pointer;
  z-index:10000;
}

.overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:9998;
}

.cart-drawer {
  position:fixed;
  top:0;
  right:-360px;
  width:340px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:9999;
  overflow-y:auto;
}

.cart-drawer.open { right:0; }
.overlay.show { display:block; }

.cart-item {
  border-bottom:1px solid #333;
  padding:10px 0;
}

.qty-controls {
  display:flex;
  gap:8px;
  align-items:center;
}

.qty-controls button {
  background:#333;
  color:#fff;
  border:none;
  padding:4px 10px;
  cursor:pointer;
}

.remove {
  color:red;
  cursor:pointer;
}

/* ================= LIGHTBOX ================= */
.lightbox {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.lightbox img {
  max-width:90%;
  max-height:90%;
}

/* ================= TOAST ================= */
.toast {
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:white;
  padding:10px 16px;
  border-radius:6px;
  opacity:0;
  transition:0.3s;
  z-index:100000;
}

.toast.show { opacity:1; }

/* Spinning Animation */
.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top: 2px solid #fff;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<header>
  <div class="header-container">
    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>
      <div class="dropdown">
        <span>Service Types ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <a href="index.html">
        <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png" alt="Reliatech Logo">
      </a>
    </div>

    <div class="nav-section">
      <div class="dropdown">
        <span>More ▾</span>
        <div class="dropdown-content">
          <a href="about-us.html">About Us</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
      <button id="themeToggle">Toggle Theme</button>
    </div>
  </div>
</header>

<section class="shop-hero">
  <div class="hero-content">
    <h1>RELIATECH 3D Prints</h1>
    <p>
      Unique 3D printed decor, wall art, gifts, and custom creations.
      Designed and printed locally.
    </p>
  </div>
</section>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All Products</button>
  <button class="filter-btn" data-filter="wall-art">Wall Art</button>
  <button class="filter-btn" data-filter="disney">Disney Collection</button>
  <button class="filter-btn" data-filter="toy">Toys</button>
  <button class="filter-btn" data-filter="accessory">Accessories</button>
</div>

<section class="products" id="productsContainer">
  <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
    <span class="spinner" style="border-top-color: #f1641e; width: 32px; height: 32px;"></span>
    <p style="margin-top: 10px;">Loading catalog items...</p>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" alt="Enlarged View">
</div>

<div class="cart-button" id="cartBtn">🛒 <span id="count">0</span></div>
<div class="overlay" id="overlay"></div>

<div class="cart-drawer" id="drawer"></div>

<div class="toast" id="toast"></div>

<div id="checkoutModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100000; justify-content:center; align-items:center;">
  <div style="background:var(--card-bg); padding:20px; border-radius:10px; width:300px; color:var(--text-color);">
    <h3>Checkout</h3>
    <input id="custName" placeholder="Full Name" style="width:100%; margin:5px 0; padding:8px; box-sizing: border-box;">
    <input id="custEmail" type="email" placeholder="Email" style="width:100%; margin:5px 0; padding:8px; box-sizing: border-box;">
    <input id="custPhone" placeholder="Phone Number" style="width:100%; margin:5px 0; padding:8px; box-sizing: border-box;">
    <p id="orderStatus" style="margin-top:10px; font-size:0.9rem;"></p>
    
    <button id="submitBtn" onclick="submitOrder()" style="margin-top:10px; width:100%; padding:10px; background:#28a745; color:white; border:none; font-weight:bold; cursor:pointer;">
      Submit Order
    </button>
    <button onclick="closeCheckout()" style="margin-top:5px; width:100%; padding:8px; cursor:pointer;">
      Cancel
    </button>
  </div>
</div>
  
<script>
/* ================= CONFIGURATION ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec";

let catalogItems = [];
let cart = [];

/* ================= FETCH DYNAMIC CATALOG ON INITIAL LOAD ================= */
document.addEventListener("DOMContentLoaded", () => {
  fetch(`${API_URL}?action=catalog`)
    .then(res => res.json())
    .then(data => {
      catalogItems = data;
      renderCatalog(catalogItems);
    })
    .catch(err => {
      console.error("Error accessing catalog:", err);
      document.getElementById("productsContainer").innerHTML = `
        <p style="color:red; text-align:center; grid-column:1/-1;">
          Failed to load catalog. Please check your network connection and reload.
        </p>`;
    });
});

/* ================= DYNAMIC INVENTORY RENDER ENGINE ================= */
function renderCatalog(items) {
  const container = document.getElementById("productsContainer");
  container.innerHTML = ""; // Clear loader animation

  if(items.length === 0) {
    container.innerHTML = `<p style="text-align:center; grid-column:1/-1;">No items found in active catalog.</p>`;
    return;
  }

  items.forEach(item => {
    // Determine whether a color dropdown is required
    const hasColors = item.Colors && item.Colors.toString().toLowerCase() !== "n/a" && item.Colors.toString().trim() !== "";
    let colorOptionsHTML = "";

    if (hasColors) {
      const colorList = item.Colors.split(",").map(c => c.trim());
      colorOptionsHTML = `<select class="color">`;
      colorList.forEach(color => {
        colorOptionsHTML += `<option>${color}</option>`;
      });
      colorOptionsHTML += `</select>`;
    }

    const card = document.createElement("div");
    card.className = "product-card";
    card.dataset.category = item.Category;

    card.innerHTML = `
      <img src="${item.Image}" loading="lazy" alt="${item.Name}">
      <div class="product-info">
        <h3>${item.Name}</h3>
        <div class="price">$${item.Price}</div>
        <p>${item.Description}</p>
        <div class="controls">
          <input class="qty" type="number" value="1" min="1" oninput="this.value = Math.max(1, this.value)">
          ${colorOptionsHTML}
          <button class="order-btn" onclick="addToCart('${escapeHtml(item.Name)}', ${item.Price}, this)">
            Add to Cart
          </button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  // Re-link zoom modules for lightboxes
  initLightbox();
}

/* ================= FILTER LOGIC ================= */
const filterButtons = document.querySelectorAll(".filter-btn");
filterButtons.forEach(button => {
  button.addEventListener("click", () => {
    filterButtons.forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    
    const filter = button.dataset.filter;
    const cards = document.querySelectorAll(".product-card");
    
    cards.forEach(card => {
      if (filter === "all" || card.dataset.category === filter) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });
  });
});

/* ================= THEME TOGGLE ================= */
document.getElementById("themeToggle").addEventListener("click", () => {
  document.body.classList.toggle("light-theme");
});

/* ================= LIGHTBOX MANAGEMENT ================= */
const lightbox = document.getElementById("lightbox");
const lightImg = document.getElementById("lightbox-img");

function initLightbox() {
  document.querySelectorAll(".product-card img").forEach(img => {
    img.onclick = () => {
      lightbox.style.display = "flex";
      lightImg.src = img.src;
    };
  });
}
lightbox.onclick = () => lightbox.style.display = "none";

/* ================= TOAST SYSTEM ================= */
const toast = document.getElementById("toast");
const successSound = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1200);
}

/* ================= SHOPPING CART BUSINESS LOGIC ================= */
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");

document.getElementById("cartBtn").onclick = () => {
  drawer.classList.add("open");
  overlay.classList.add("show");
};

overlay.onclick = () => {
  drawer.classList.remove("open");
  overlay.classList.remove("show");
};

function addToCart(name, price, buttonEl) {
  const controlsDiv = buttonEl.parentElement;
  const qtyInput = controlsDiv.querySelector(".qty");
  const colorSelect = controlsDiv.querySelector(".color");
  
  let qty = Math.max(1, parseInt(qtyInput.value) || 1);
  let color = colorSelect ? colorSelect.value : "N/A";

  // Optimized Check: If structural duplicate parameters are met, stack quantities instead of adding lines
  const existingItem = cart.find(item => item.name === name && item.color === color);
  
  if (existingItem) {
    existingItem.qty += qty;
  } else {
    cart.push({ name, price: +price, qty, color });
  }

  showToast("Added to cart");
  updateCartUI();
  qtyInput.value = 1; // Reset product view input field
}

function updateCartUI(){
  let box = document.getElementById("drawer");
  let total = 0;

  box.innerHTML = `
    <h3>Cart</h3>
    <hr style="border-color:#333;">
  `;

  cart.forEach((item, i) => {
    let t = item.price * item.qty;
    total += t;

    box.innerHTML += `
      <div class="cart-item">
        <p style="margin:4px 0;"><b>${item.name}</b></p>
        <p style="margin:4px 0; font-size:0.9rem; opacity:0.7;">Color: ${item.color}</p>
        <div class="qty-controls" style="margin:8px 0;">
          <button onclick="dec(${i})">-</button>
          <span>${item.qty}</span>
          <button onclick="inc(${i})">+</button>
        </div>
        <p style="margin:4px 0; color:#f1641e;"><b>$${t}</b></p>
        <span class="remove" onclick="removeItem(${i})">Remove</span>
      </div>
    `;
  });

  box.innerHTML += `
    <hr style="border-color:#333; margin-top:15px;">
    <h3>Total: $${total}</h3>
    <button onclick="openCheckout()" style="width:100%; padding:12px; background:#28a745; color:white; border:none; font-weight:bold; border-radius:4px; cursor:pointer; margin-top:10px;">
      Checkout
    </button>
  `;

  // Display absolute physical item counts inside the top tracker bubble badge
  document.getElementById("count").innerText = cart.reduce((sum, item) => sum + item.qty, 0);
}

function inc(i) { cart[i].qty++; updateCartUI(); }
function dec(i) { if(cart[i].qty > 1){ cart[i].qty--; updateCartUI(); } }
function removeItem(i) { cart.splice(i, 1); updateCartUI(); }

/* ================= CONTROL MODAL ================= */
function openCheckout(){
  if(cart.length === 0) { alert("Your cart is empty!"); return; }
  document.getElementById("checkoutModal").style.display = "flex";
}

function closeCheckout(){
  document.getElementById("checkoutModal").style.display = "none";
}

/* ================= ORDER TRANSACTION PIPELINE ================= */
function submitOrder(){
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("orderStatus");

  let name = document.getElementById("custName").value.trim();
  let email = document.getElementById("custEmail").value.trim();
  let phone = document.getElementById("custPhone").value.trim();

  if(!name || !email || !phone){
    alert("Please fill all fields");
    return;
  }

  // Freeze user action controls immediately
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Processing...`;
  status.style.color = "#ccc";
  status.innerText = "Submitting your order...";

  const order = {
    name,
    email,
    phone,
    items: cart,
    total: cart.reduce((sum, i) => sum + i.price * i.qty, 0)
  };

  // Immediate UI layout cleanup
  drawer.classList.remove("open");
  overlay.classList.remove("show");

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(order)
  })
  .then(res => res.json())
  .then(data => {
    if(data.success) {
      status.style.color = "lightgreen";
      status.innerText = "✔ Order received!";
      successSound.play().catch(() => {});

      btn.innerHTML = "Submit Order";
      btn.disabled = false;

      cart = [];
      updateCartUI();

      // Wipe client inputs clean
      document.getElementById("custName").value = "";
      document.getElementById("custEmail").value = "";
      document.getElementById("custPhone").value = "";

      setTimeout(() => {
        closeCheckout();
        status.innerText = "";
      }, 1200);
    } else {
      throw new Error(data.error || "Server rejected transaction processing.");
    }
  })
  .catch(err => {
    console.error(err);
    status.style.color = "red";
    status.innerText = "Error submitting order. Try again.";
    btn.innerHTML = "Submit Order";
    btn.disabled = false;
  });
}

/* ================= ESCAPE UTILITIES (Anti-Injection Protection) ================= */
function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>

</body>
</html>
