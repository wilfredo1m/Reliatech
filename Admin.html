<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>

body {
  font-family: Arial;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}

/* LOGIN */

#loginScreen {
  max-width:400px;
  margin:100px auto;
  background:#1a1a1a;
  padding:40px;
  border-radius:12px;
}

#loginBtn,
#logoutBtn {
  background:#28a745;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

#logoutBtn {
  background:#dc3545;
}

#error {
  color:#ff5c5c;
  margin-top:15px;
}

/* DASHBOARD */

#dashboard {
  display:none;
}

/* TOPBAR */

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  gap:10px;
  flex-wrap:wrap;
}

.card {
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

/* TABLE */

table {
  width:100%;
  border-collapse:collapse;
}

th,
td {
  border:1px solid #333;
  padding:10px;
}

th {
  background:#222;
}

tr.order-row {
  cursor:pointer;
  background:#151515;
}

tr.order-row:hover {
  background:#1d1d1d;
}

/* ITEMS */

.item-row {
  background:#0f0f0f;
}

.item-box {
  padding-left:30px;
  font-size:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* PROGRESS */

.progress-wrap {
  margin-top:6px;
  background:#333;
  height:6px;
  border-radius:5px;
  overflow:hidden;
}

.progress-bar {
  height:6px;
  background:#28a745;
  width:0%;
  transition:0.3s;
}

/* STATUS */

select {
  padding:5px;
  border-radius:5px;
  background:#222;
  color:#fff;
  border:1px solid #555;
}

/* CHECKBOX */

.item-box input {
  transform: scale(1.2);
  margin-right:10px;
}

/* SMALL */

.small {
  opacity:0.7;
  font-size:12px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <h2>Admin Login</h2>

  <button id="loginBtn" onclick="login()">
    Sign in with Google
  </button>

  <div id="error"></div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

  <div class="topbar">

    <div class="card">
      📦 Orders:
      <span id="orderCount">0</span>
    </div>

    <div class="card">
      💰 Revenue:
      $<span id="revenue">0.00</span>
    </div>

    <button id="logoutBtn" onclick="logout()">
      Logout
    </button>

  </div>

  <table>

    <thead>

      <tr>
        <th>Order</th>
        <th>Date</th>
        <th>Name</th>
        <th>Total</th>
        <th>Status</th>
      </tr>

    </thead>

    <tbody id="ordersTable"></tbody>

  </table>

</div>

<script>

// ================= FIREBASE =================

const firebaseConfig = {
  apiKey: "AIzaSyCp9mESjEcVQ_PX-Jv31JFTSFA0omcjfJs",
  authDomain: "admindashboard-e7190.firebaseapp.com",
  projectId: "admindashboard-e7190",
  appId: "1:729683991497:web:ea1f4358fdfd9bc87c6618"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

// ================= ADMIN =================

const ADMIN_EMAIL =
  "reliatechdigitalsolutions@gmail.com";

// MUST MATCH APPS SCRIPT

const ADMIN_TOKEN =
  "CHANGE_THIS_SECRET_TOKEN";

// ================= API =================

const API_URL =
  "https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec";

// ================= STATE =================

let ordersCache = [];

let itemsCache = [];

let lastCount = 0;

let refreshInterval = null;

let isLoading = false;

let expandedOrders = new Set();

const sound = new Audio(
  "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

// ================= LOGIN =================

function login() {

  const provider =
    new firebase.auth.GoogleAuthProvider();

  auth
    .signInWithPopup(provider)
    .catch(err => {

      document.getElementById("error").innerText =
        err.message;

    });

}

// ================= LOGOUT =================

function logout() {

  if (refreshInterval) {

    clearInterval(refreshInterval);

    refreshInterval = null;

  }

  auth.signOut();

}

// ================= AUTH =================

auth.onAuthStateChanged(user => {

  if (user) {

    if (user.email !== ADMIN_EMAIL) {

      alert("Access denied");

      auth.signOut();

      return;

    }

    document.getElementById("loginScreen").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";

    loadAll();

    if (!refreshInterval) {

      refreshInterval = setInterval(() => {

        loadAll();

      }, 10000);

    }

  } else {

    document.getElementById("loginScreen").style.display =
      "block";

    document.getElementById("dashboard").style.display =
      "none";

  }

});

// ================= LOAD DATA =================

async function loadAll() {

  if (isLoading) return;

  isLoading = true;

  try {

    const [ordersRes, itemsRes] =
      await Promise.all([

        fetch(API_URL + "?t=" + Date.now()),

        fetch(
          API_URL +
          "?action=items&t=" +
          Date.now()
        )

      ]);

    const orders = await ordersRes.json();

    const items = await itemsRes.json();

    ordersCache = orders;

    itemsCache = items;

    render();

  } catch (err) {

    console.error(err);

  } finally {

    isLoading = false;

  }

}

// ================= PROGRESS =================

function getProgress(orderId) {

  const items = itemsCache.filter(

    i => i["Order ID"] === orderId

  );

  const done = items.filter(

    i => i.Status === "Done"

  ).length;

  const total = items.length;

  return {

    done,

    total,

    percent: total
      ? (done / total) * 100
      : 0

  };

}

// ================= RENDER =================

function render() {

  let html = "";

  let revenue = 0;

  // NEW ORDER SOUND

  if (

    lastCount &&
    ordersCache.length > lastCount

  ) {

    sound.currentTime = 0;

    sound.play().catch(() => {});

  }

  lastCount = ordersCache.length;

  document.getElementById("orderCount").innerText =
    ordersCache.length;

  [...ordersCache].reverse().forEach(order => {

    revenue += Number(order.Total || 0);

    const orderId =
      String(order["Order ID"]);

    const p =
      getProgress(orderId);

    html += `

      <tr class="order-row"
          onclick="toggle('${escapeQuotes(orderId)}')">

        <td>

          ${orderId}

          <div class="progress-wrap">

            <div class="progress-bar"
                 style="width:${p.percent}%">

            </div>

          </div>

          <div class="small">
            ${p.done}/${p.total} items done
          </div>

        </td>

        <td>${order.Date || ""}</td>

        <td>${order.Name || ""}</td>

        <td>
          $${Number(order.Total || 0).toFixed(2)}
        </td>

        <td onclick="event.stopPropagation()">

          <select

            onchange="
              updateStatus(
                '${escapeQuotes(orderId)}',
                this.value,
                this
              )
            "

          >

            <option
              value="Pending"
              ${order.Status==="Pending"
                ? "selected"
                : ""
              }>
              Pending
            </option>

            <option
              value="Shipped"
              ${order.Status==="Shipped"
                ? "selected"
                : ""
              }>
              Shipped
            </option>

            <option
              value="Done"
              ${order.Status==="Done"
                ? "selected"
                : ""
              }>
              Done
            </option>

          </select>

        </td>

      </tr>

    `;

    const items = itemsCache.filter(

      i => i["Order ID"] === orderId

    );

    items.forEach(item => {

      html += `

        <tr
          class="item-row item-${cssSafe(orderId)}"

          style="
            display:${
              expandedOrders.has(orderId)
                ? "table-row"
                : "none"
            };
          "

        >

          <td colspan="5">

            <div class="item-box">

              <label>

                <input

                  type="checkbox"

                  data-order="${orderId}"

                  data-item="${escapeQuotes(item.Item)}"

                  data-color="${escapeQuotes(item.Color)}"

                  onchange="
                    toggleItem(
                      '${escapeQuotes(orderId)}',
                      '${escapeQuotes(item.Item)}',
                      '${escapeQuotes(item.Color)}',
                      this.checked,
                      this
                    )
                  "

                  ${
                    item.Status === "Done"
                      ? "checked"
                      : ""
                  }

                >

                ${item.Item}

                <span class="small">
                  (${item.Color})
                </span>

                x${item.Qty}

              </label>

              <span class="small">

                $${Number(item.Subtotal || 0).toFixed(2)}

              </span>

            </div>

          </td>

        </tr>

      `;

    });

  });

  document.getElementById("ordersTable").innerHTML =
    html;

  document.getElementById("revenue").innerText =
    revenue.toFixed(2);

}

// ================= TOGGLE =================

function toggle(orderId) {

  if (expandedOrders.has(orderId)) {

    expandedOrders.delete(orderId);

  } else {

    expandedOrders.add(orderId);

  }

  render();

}

// ================= UPDATE STATUS =================

async function updateStatus(
  orderId,
  status,
  selectElement
) {

  if (selectElement) {

    selectElement.disabled = true;

  }

  try {

    await fetch(API_URL, {

      method:"POST",

      body: JSON.stringify({

        token: ADMIN_TOKEN,

        action:"updateStatus",

        orderId,

        status

      })

    });

    await loadAll();

  } catch (err) {

    console.error(err);

    alert("Failed to update status");

  } finally {

    if (selectElement) {

      selectElement.disabled = false;

    }

  }

}

// ================= TOGGLE ITEM =================

async function toggleItem(
  orderId,
  item,
  color,
  checked,
  checkbox
) {

  if (checkbox) {

    checkbox.disabled = true;

  }

  try {

    await fetch(API_URL, {

      method:"POST",

      body: JSON.stringify({

        token: ADMIN_TOKEN,

        action:"updateItem",

        orderId,

        item,

        color,

        status:
          checked
            ? "Done"
            : "Pending"

      })

    });

    await loadAll();

    checkComplete(orderId);

  } catch (err) {

    console.error(err);

    alert("Failed to update item");

  } finally {

    if (checkbox) {

      checkbox.disabled = false;

    }

  }

}

// ================= AUTO COMPLETE =================

function checkComplete(orderId) {

  const items = itemsCache.filter(

    i => i["Order ID"] === orderId

  );

  if (!items.length) return;

  const allDone = items.every(

    i => i.Status === "Done"

  );

  if (allDone) {

    updateStatus(orderId, "Done");

  }

}

// ================= HELPERS =================

function escapeQuotes(str) {

  return String(str)

    .replace(/'/g, "\\'")

    .replace(/"/g, "&quot;");

}

function cssSafe(str) {

  return String(str)

    .replace(/[^a-zA-Z0-9_-]/g, "");

}

</script>

</body>
</html>
