<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>
:root {
  --bg-color:#000;
  --text-color:#fff;
  --card-bg:#111;
  --button-bg:#28a745;
  --button-hover:#1e7e34;
  --header-bg:#222;
  --dropdown-bg:#333;
  --dropdown-hover:#444;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
}

/* ================= HEADER (RESTORED EXACT STRUCTURE) ================= */

header{
  background:var(--header-bg);
  color:var(--text-color);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.nav-section{
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo-link{
  color:var(--text-color);
  text-decoration:none;
  font-weight:bold;
  font-size:1.2rem;
}

.dropdown{
  position:relative;
  cursor:pointer;
}

.dropdown-content{
  display:none;
  position:absolute;
  top:100%;
  background:var(--dropdown-bg);
  min-width:180px;
  border-radius:4px;
}

.dropdown:hover .dropdown-content{
  display:block;
}

.dropdown-content a{
  display:block;
  padding:10px;
  text-decoration:none;
  color:var(--text-color);
}

.dropdown-content a:hover{
  background:var(--dropdown-hover);
}

.center-image img{
  height:80px;
}

#themeToggle{
  background:none;
  border:1px solid var(--text-color);
  color:var(--text-color);
  padding:0.5rem 1rem;
  border-radius:4px;
  cursor:pointer;
}

/* ================= PRODUCTS ================= */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:2rem;
  padding:2rem;
  max-width:1200px;
  margin:auto;
}

.product-card{
  background:var(--card-bg);
  border-radius:10px;
  overflow:hidden;
  text-align:center;
}

.product-card img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#000;
  padding:10px;
  cursor:zoom-in;
}

.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0 15px;
}

.qty,.color{width:80px;}

.order-btn{
  background:var(--button-bg);
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}

/* ================= CART ================= */

.cart-button{
  position:fixed;
  top:20px;
  right:20px;
  background:#28a745;
  padding:10px 14px;
  border-radius:50px;
  cursor:pointer;
  z-index:10000;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:9998;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-360px;
  width:340px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:9999;
  overflow-y:auto;
}

.cart-drawer.open{right:0;}
.overlay.show{display:block;}

.cart-header{
  display:flex;
  justify-content:space-between;
}

.close{cursor:pointer;}

.cart-item{
  border-bottom:1px solid #333;
  padding:10px 0;
}

.qty-controls{
  display:flex;
  gap:8px;
  align-items:center;
}

.qty-btn{
  background:#333;
  color:#fff;
  border:none;
  padding:2px 8px;
  cursor:pointer;
}

.remove{
  color:red;
  cursor:pointer;
  display:block;
  margin-top:5px;
}

.cart-footer{
  position:absolute;
  bottom:20px;
  width:90%;
}

/* ================= LIGHTBOX ================= */

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:white;
  padding:10px 16px;
  border-radius:6px;
  opacity:0;
  transition:0.3s;
  z-index:100000;
}

.toast.show{opacity:1;}

</style>
</head>

<body>

<!-- ================= HEADER (FULLY RESTORED, UNCHANGED FUNCTIONALLY) ================= -->
<header>
  <div class="header-container">

    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>

      <div class="dropdown">
        <span>Service Types ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <a href="index.html">
        <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png">
      </a>
    </div>

    <div class="nav-section">
      <div class="dropdown">
        <span>More ▾</span>
        <div class="dropdown-content">
          <a href="about-us.html">About Us</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>

      <button id="themeToggle">Toggle Theme</button>
    </div>

  </div>
</header>

<!-- PRODUCTS -->
<section class="products">

  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Ear Mount</h3>
    <div class="controls">
      <input class="qty" type="number" value="1">
      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>
      <button class="order-btn" data-name="Ear Mount" data-price="6">Add</button>
    </div>
  </div>

  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>
    <div class="controls">
      <input class="qty" type="number" value="1">
      <button class="order-btn" data-name="Lithophane" data-price="60">Add</button>
    </div>
  </div>

  <div class="product-card">
    <img src="Images/Tap To Pay Star.jpeg">
    <h3>Tap To Pay Star</h3>
    <div class="controls">
      <input class="qty" type="number" value="1">
      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>
      <button class="order-btn" data-name="Tap Star" data-price="10">Add</button>
    </div>
  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<!-- CART -->
<div class="cart-button" id="cartBtn">🛒 <span id="count">0</span></div>
<div class="overlay" id="overlay"></div>

<div class="cart-drawer" id="drawer">
  <div class="cart-header">
    <h3>Cart</h3>
    <span class="close" id="close">✕</span>
  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <p>Total: $<span id="total">0</span></p>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

/* LIGHTBOX */
const lightbox=document.getElementById("lightbox");
const lightImg=document.getElementById("lightbox-img");

document.querySelectorAll(".product-card img").forEach(img=>{
  img.onclick=()=>{
    lightbox.style.display="flex";
    lightImg.src=img.src;
  };
});

lightbox.onclick=()=>lightbox.style.display="none";

/* TOAST */
const toast=document.getElementById("toast");

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1200);
}

/* CART */
let cart=[];

const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");

document.getElementById("cartBtn").onclick=()=>{
  drawer.classList.add("open");
  overlay.classList.add("show");
};

document.getElementById("close").onclick=()=>{
  drawer.classList.remove("open");
  overlay.classList.remove("show");
};

overlay.onclick=()=>{
  drawer.classList.remove("open");
  overlay.classList.remove("show");
};

/* ADD */
document.querySelectorAll(".order-btn").forEach(btn=>{
  btn.onclick=()=>{
    cart.push({
      name:btn.dataset.name,
      price:+btn.dataset.price,
      qty:+btn.parentElement.querySelector(".qty").value,
      color:btn.parentElement.querySelector(".color")?.value || "N/A"
    });

    showToast("Added to cart");
    update();
  };
});

/* UPDATE */
function update(){
  let box=document.getElementById("cart-items");
  let total=0;

  box.innerHTML="";

  cart.forEach((item,i)=>{
    let t=item.price*item.qty;
    total+=t;

    box.innerHTML+=`
      <div class="cart-item">
        <p><b>${item.name}</b></p>
        <p>${item.color}</p>

        <div class="qty-controls">
          <button class="qty-btn" onclick="dec(${i})">-</button>
          <span>${item.qty}</span>
          <button class="qty-btn" onclick="inc(${i})">+</button>
        </div>

        <span class="remove" onclick="removeItem(${i})">Remove</span>
        <p>$${t.toFixed(2)}</p>
      </div>
    `;
  });

  document.getElementById("total").innerText=total.toFixed(2);
  document.getElementById("count").innerText=cart.length;
}

function inc(i){cart[i].qty++;update();}
function dec(i){if(cart[i].qty>1){cart[i].qty--;update();}}
function removeItem(i){cart.splice(i,1);update();}

</script>

</body>
</html>
