<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>On-Site Services - Your Tech Services</title>
  <style>
    /* ========== THEME VARIABLES ========== */
    :root {
      --bg-color: #000;
      --text-color: #fff;
      --card-bg: #111;
      --button-bg: #444;
      --button-hover: #666;
      --header-bg: #222;
      --dropdown-bg: #333;
      --dropdown-hover: #444;
    }

    .light-theme {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f9f9f9;
      --button-bg: #e0e0e0;
      --button-hover: #cccccc;
      --header-bg: #f0f0f0;
      --dropdown-bg: #ffffff;
      --dropdown-hover: #e0e0e0;
    }

    /* ========== GENERAL STYLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ========== HEADER & DROPDOWN FIXES ========== */
    header {
      background: var(--header-bg);
      color: var(--text-color);
      padding: 1.5rem 1rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: padding 0.3s ease;
      height: auto; /* Changed from fixed height to auto for better dropdown flow */
      min-height: 100px;
    }

    header.shrink {
      padding: 0.5rem 1rem;
      min-height: 70px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      overflow: visible; /* Crucial for dropdown visibility */
    }

    .nav-section {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .logo-link {
      text-decoration: none;
      color: var(--text-color);
      font-weight: bold;
      font-size: 1.2rem;
    }

    /* --- DROPDOWN LOGIC --- */
    .dropdown {
      position: relative;
      display: inline-block;
      cursor: pointer;
      padding: 10px 0; /* Creates a larger hover bridge */
    }

    .dropdown-content {
      display: none; /* Keeps links hidden until hover */
      position: absolute;
      top: 100%;
      left: 0;
      background-color: var(--dropdown-bg);
      min-width: 200px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
      z-index: 2000;
      border-radius: 4px;
    }

    /* This shows the links ONLY when you hover over the 'Service Types' parent */
    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-content a {
      color: var(--text-color);
      padding: 12px 16px;
      text-decoration: none;
      display: block; /* Stacks links vertically */
      margin: 0;
      text-align: left;
    }

    .dropdown-content a:hover {
      background-color: var(--dropdown-hover);
    }

    .center-image img {
      height: 80px;
      transition: height 0.3s ease;
    }

    header.shrink .center-image img {
      height: 50px;
    }

    #themeToggle {
      background: none;
      border: 1px solid var(--text-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    /* ========== CONTENT STYLES ========== */
    .service-section {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .service-column {
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .service-header {
      text-align: center;
      margin-bottom: 1rem;
    }

    .service-header h2 {
      font-size: 2rem;
    }

    p, ul {
      text-align: justify;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    ul {
      list-style-type: square;
      padding-left: 1.5rem;
    }

    li {
      margin-bottom: 0.75rem;
    }
  </style>
</head>
