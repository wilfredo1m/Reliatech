<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#111;
  --btn:#28a745;
}

/* BASE */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  background:#222;
  padding:1.5rem;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* GRID */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.5rem;
  padding:2rem;
}

/* CARDS */
.product-card{
  background:var(--card);
  border-radius:10px;
  text-align:center;
  padding-bottom:1rem;
}

.product-card img{
  width:100%;
  height:240px;
  object-fit:contain;
  background:#000;
  padding:10px;
  cursor:zoom-in;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.qty,.color{
  width:80px;
  padding:4px;
}

.order-btn{
  background:var(--btn);
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:85%;
}

/* CART BUTTON */
.cart-button{
  position:fixed;
  top:20px;
  right:20px;
  background:#28a745;
  padding:10px 14px;
  border-radius:50px;
  cursor:pointer;
  z-index:10000;
}

/* CART DRAWER */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:9998;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#111;
  padding:15px;
  transition:0.3s;
  z-index:9999;
  overflow-y:auto;
}

.cart-drawer.open{right:0;}
.overlay.show{display:block;}

.cart-header{
  display:flex;
  justify-content:space-between;
}

.cart-item{
  border-bottom:1px solid #333;
  padding:10px 0;
}

.cart-footer{
  position:absolute;
  bottom:20px;
  width:90%;
}

#checkoutBtn{
  width:100%;
  padding:10px;
  background:green;
  border:none;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="header-container">
    <a href="index.html" style="color:white;text-decoration:none;">Home</a>
    <h2>3D Printing Services</h2>
  </div>
</header>

<!-- PRODUCTS -->
<section class="products">

  <!-- MOUNT -->
  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Disney Ear Mount</h3>

    <div class="controls">
      <input class="qty" type="number" value="1">

      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>

      <button class="order-btn" data-name="Ear Mount" data-price="6">Add</button>
    </div>
  </div>

  <!-- LITHOPHANE -->
  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <button class="order-btn" data-name="Lithophane" data-price="60">Add</button>
    </div>
  </div>

  <!-- STAR -->
  <div class="product-card">
    <img src="Images/Tap To Pay Star.jpeg">
    <h3>Tap To Pay Star</h3>

    <div class="controls">
      <input class="qty" type="number" value="1">

      <select class="color">
        <option>Red</option><option>Blue</option>
        <option>White</option><option>Black</option>
        <option>Yellow</option><option>Green</option>
        <option>Pink</option><option>Hot Pink</option>
        <option>Purple</option>
      </select>

      <button class="order-btn" data-name="Tap Star" data-price="10">Add</button>
    </div>
  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<!-- CART -->
<div class="cart-button" id="cartBtn">🛒 <span id="cartCount">0</span></div>

<div class="overlay" id="overlay"></div>

<div class="cart-drawer" id="drawer">
  <div class="cart-header">
    <h3>Cart</h3>
    <span id="close">✕</span>
  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">
    <p>Total: $<span id="total">0</span></p>
    <button id="checkoutBtn">Checkout</button>
  </div>
</div>

<script>

/* LIGHTBOX */
const lightbox=document.getElementById("lightbox");
const lightImg=document.getElementById("lightbox-img");

document.querySelectorAll("img").forEach(img=>{
  img.onclick=()=>{
    lightbox.style.display="flex";
    lightImg.src=img.src;
  };
});

lightbox.onclick=()=>lightbox.style.display="none";

/* CART */
let cart=[];

const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");

document.getElementById("cartBtn").onclick=()=>{
  drawer.classList.add("open");
  overlay.classList.add("show");
};

document.getElementById("close").onclick=closeCart;
overlay.onclick=closeCart;

function closeCart(){
  drawer.classList.remove("open");
  overlay.classList.remove("show");
}

/* ADD */
document.querySelectorAll(".order-btn").forEach(btn=>{
  btn.onclick=()=>{
    let name=btn.dataset.name;
    let price=+btn.dataset.price;
    let qty=btn.parentElement.querySelector(".qty").value;
    let colorEl=btn.parentElement.querySelector(".color");
    let color=colorEl?colorEl.value:"N/A";

    cart.push({name,price,qty,color});
    update();
  };
});

/* UPDATE */
function update(){
  let box=document.getElementById("cart-items");
  let total=0;

  box.innerHTML="";

  cart.forEach(i=>{
    let t=i.price*i.qty;
    total+=t;

    box.innerHTML+=`
      <div class="cart-item">
        <p><b>${i.name}</b></p>
        <p>${i.color}</p>
        <p>${i.qty} x $${i.price}</p>
      </div>
    `;
  });

  document.getElementById("total").innerText=total.toFixed(2);
  document.getElementById("cartCount").innerText=cart.length;
}

</script>

</body>
</html>
