<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#fff;
  margin:0;
  padding:20px;
}

/* TOP BAR */
.topbar {
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.card {
  background:#222;
  padding:10px 15px;
  border-radius:8px;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  border:1px solid #333;
  padding:10px;
}

th {
  background:#222;
}

tr.order-row {
  cursor:pointer;
  background:#151515;
}

tr.order-row:hover {
  background:#1d1d1d;
}

/* ITEM ROWS */
.item-row {
  background:#0f0f0f;
}

.item-box {
  padding-left:30px;
  font-size:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* PROGRESS BAR */
.progress-wrap {
  margin-top:6px;
  background:#333;
  height:6px;
  border-radius:5px;
  overflow:hidden;
}

.progress-bar {
  height:6px;
  background:#28a745;
  width:0%;
}

/* STATUS */
select {
  padding:5px;
  border-radius:5px;
  background:#222;
  color:#fff;
  border:1px solid #555;
}

/* CHECKBOX */
.item-box input {
  transform: scale(1.2);
  margin-right:10px;
}

.small {
  opacity:0.7;
  font-size:12px;
}

/* LOGIN SCREEN */
#loginScreen {
  display:none;
  max-width:350px;
  margin:100px auto;
  background:#1a1a1a;
  padding:30px;
  border-radius:10px;
}

#loginScreen input {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:6px;
  background:#222;
  color:#fff;
}

#loginScreen button,
#logoutBtn {
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#28a745;
  color:white;
  cursor:pointer;
}

#logoutBtn {
  background:#dc3545;
}

#error {
  color:#ff6b6b;
  margin-top:10px;
}

/* DASHBOARD */
#dashboard {
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">

  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="error"></div>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <div class="topbar">

    <div class="card">
      📦 Orders: <span id="orderCount">0</span>
    </div>

    <div class="card">
      💰 Revenue: $<span id="revenue">0</span>
    </div>

    <button id="logoutBtn" onclick="logout()">Logout</button>

  </div>

  <table>
    <thead>
      <tr>
        <th>Order</th>
        <th>Date</th>
        <th>Name</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="ordersTable"></tbody>
  </table>

</div>

<script>

// ================= FIREBASE CONFIG =================

const firebaseConfig = {
   apiKey: "AIzaSyCp9mESjEcVQ_PX-Jv31JFTSFA0omcjfJs",
   authDomain: "admindashboard-e7190.firebaseapp.com",
   projectId: "admindashboard-e7190",
   appId: "1:729683991497:web:ea1f4358fdfd9bc87c6618"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

// ================= API =================

const API_URL = "https://script.google.com/macros/s/AKfycbzE3ClMRXPtySMu-NoTJsVeFImOh-8gYPjFE0tYLqV9AyiknmiWka9lKcl0WSM6cN88nA/exec";

let ordersCache = [];
let itemsCache = [];
let lastCount = 0;

const sound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

// ================= AUTH STATE =================

auth.onAuthStateChanged(user => {

  if (user) {

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    loadAll();

    setInterval(loadAll, 10000);

  } else {

    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("dashboard").style.display = "none";

  }

});

// ================= LOGIN =================

function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => {
      document.getElementById("error").innerText = err.message;
    });

}

// ================= LOGOUT =================

function logout() {
  auth.signOut();
}

// ================= LOAD DATA =================

function loadAll() {

  Promise.all([

    fetch(API_URL + "?t=" + Date.now())
      .then(r => r.json()),

    fetch(API_URL + "?action=items&t=" + Date.now())
      .then(r => r.json())

  ])
  .then(([orders, items]) => {

    ordersCache = orders;
    itemsCache = items;

    render();

  })
  .catch(err => {
    console.error(err);
  });

}

// ================= PROGRESS =================

function getProgress(orderId) {

  const items = itemsCache.filter(
    i => i["Order ID"] === orderId
  );

  const done = items.filter(i =>
    document.querySelector(
      `input[data-order="${orderId}"][data-item="${i.Item}"]:checked`
    )
  ).length;

  const total = items.length;

  return {
    done,
    total,
    percent: total ? (done / total) * 100 : 0
  };
}

// ================= RENDER =================

function render() {

  let html = "";
  let revenue = 0;

  if (lastCount && ordersCache.length > lastCount) {
    sound.play();
  }

  lastCount = ordersCache.length;

  document.getElementById("orderCount").innerText = ordersCache.length;

  ordersCache.reverse().forEach(order => {

    revenue += Number(order.Total || 0);

    const p = getProgress(order["Order ID"]);

    html += `
      <tr class="order-row" onclick="toggle('${order["Order ID"]}')">

        <td>

          ${order["Order ID"]}

          <div class="progress-wrap">
            <div class="progress-bar"
                 style="width:${p.percent}%">
            </div>
          </div>

          <div class="small">
            ${p.done}/${p.total} items done
          </div>

        </td>

        <td>${order.Date}</td>
        <td>${order.Name}</td>
        <td>$${order.Total}</td>

        <td onclick="event.stopPropagation()">

          <select onchange="updateStatus('${order["Order ID"]}',this.value)">

            <option ${order.Status==="Pending"?"selected":""}>
              Pending
            </option>

            <option ${order.Status==="Shipped"?"selected":""}>
              Shipped
            </option>

            <option ${order.Status==="Done"?"selected":""}>
              Done
            </option>

          </select>

        </td>

      </tr>
    `;

    const items = itemsCache.filter(
      i => i["Order ID"] === order["Order ID"]
    );

    items.forEach(item => {

      html += `
        <tr class="item-row item-${order["Order ID"]}"
            style="display:none;">

          <td colspan="5">

            <div class="item-box">

              <label>

                <input
                  type="checkbox"

                  data-order="${item["Order ID"]}"

                  data-item="${item.Item}"

                  onchange="toggleItem(
                    '${item["Order ID"]}',
                    '${item.Item}',
                    this.checked
                  )"

                  ${item.Status==="Done"?"checked":""}
                >

                ${item.Item}
                <span class="small">
                  (${item.Color})
                </span>

                x${item.Qty}

              </label>

              <span class="small">
                $${item.Subtotal}
              </span>

            </div>

          </td>

        </tr>
      `;
    });

  });

  document.getElementById("ordersTable").innerHTML = html;
  document.getElementById("revenue").innerText = revenue;

}

// ================= TOGGLE ORDER =================

function toggle(orderId) {

  document.querySelectorAll(".item-" + orderId)
    .forEach(r => {

      r.style.display =
        r.style.display === "none"
        ? "table-row"
        : "none";

    });

}

// ================= UPDATE STATUS =================

function updateStatus(orderId, status) {

  fetch(API_URL + "?action=updateStatus", {
    method:"POST",
    body: JSON.stringify({
      orderId,
      status
    })
  })
  .then(loadAll);

}

// ================= TOGGLE ITEM =================

function toggleItem(orderId, item, checked) {

  fetch(API_URL, {

    method:"POST",

    body: JSON.stringify({

      action:"updateItem",
      orderId,
      item,

      status: checked
        ? "Done"
        : "Pending"

    })

  })
  .then(() => checkComplete(orderId));

}

// ================= AUTO COMPLETE =================

function checkComplete(orderId) {

  const items = itemsCache.filter(
    i => i["Order ID"] === orderId
  );

  const allDone = items.every(i =>

    document.querySelector(
      `input[data-order="${orderId}"][data-item="${i.Item}"]:checked`
    )

  );

  if (allDone) {
    updateStatus(orderId, "Done");
  }

}

</script>

</body>
</html>
