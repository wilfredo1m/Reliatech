<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>

/* ================= THEME (MATCHES YOUR WORKING PAGE EXACTLY) ================= */

:root {
  --bg-color:#000;
  --text-color:#fff;
  --card-bg:#111;
  --button-bg:#28a745;
  --button-hover:#1e7e34;
  --header-bg:#222;
  --dropdown-bg:#333;
  --dropdown-hover:#444;
}

body.light-theme {
  --bg-color:#ffffff;
  --text-color:#000000;
  --card-bg:#f9f9f9;
  --button-bg:#007bff;
  --button-hover:#0056b3;
  --header-bg:#f0f0f0;
  --dropdown-bg:#ffffff;
  --dropdown-hover:#e0e0e0;
}

/* FORCE VARIABLES TO APPLY PROPERLY */
body {
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  transition: background 0.3s ease, color 0.3s ease;
}

/* ================= HEADER (UNCHANGED SAFE COPY) ================= */

header {
  background:var(--header-bg);
  color:var(--text-color);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-container {
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.nav-section {
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo-link {
  color:var(--text-color);
  text-decoration:none;
  font-weight:bold;
}

/* dropdown */
.dropdown {
  position:relative;
}

.dropdown-content {
  display:none;
  position:absolute;
  top:100%;
  background:var(--dropdown-bg);
  min-width:180px;
  border-radius:4px;
}

.dropdown:hover .dropdown-content {
  display:block;
}

.dropdown-content a {
  display:block;
  padding:10px;
  text-decoration:none;
  color:var(--text-color);
}

.dropdown-content a:hover {
  background:var(--dropdown-hover);
}

.center-image img {
  height:80px;
}

#themeToggle {
  background:none;
  border:1px solid var(--text-color);
  color:var(--text-color);
  padding:0.5rem 1rem;
  cursor:pointer;
}

/* ================= PRODUCTS ================= */

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:2rem;
  padding:2rem;
  max-width:1200px;
  margin:auto;
}

.product-card {
  background:var(--card-bg);
  border-radius:10px;
  text-align:center;
}

.product-card img {
  width:100%;
  height:220px;
  object-fit:contain;
  background:#000;
  padding:10px;
  cursor:zoom-in;
}

/* ================= CART ================= */

.cart-button {
  position:fixed;
  top:20px;
  right:20px;
  background:#28a745;
  padding:10px 14px;
  border-radius:50px;
  cursor:pointer;
  z-index:10000;
}

/* ================= LIGHTBOX ================= */

.lightbox {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.lightbox img {
  max-width:90%;
  max-height:90%;
}

/* ================= TOAST ================= */

.toast {
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#28a745;
  color:white;
  padding:10px 16px;
  border-radius:6px;
  opacity:0;
  transition:0.3s;
}

.toast.show {
  opacity:1;
}

</style>
</head>

<body>

<!-- ================= HEADER (UNCHANGED) ================= -->
<header>
  <div class="header-container">

    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>
      <div class="dropdown">
        <span>Service Types ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <a href="index.html">
        <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png">
      </a>
    </div>

    <div class="nav-section">
      <div class="dropdown">
        <span>More ▾</span>
        <div class="dropdown-content">
          <a href="about-us.html">About Us</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>

      <button id="themeToggle">Toggle Theme</button>
    </div>

  </div>
</header>

<!-- PRODUCTS -->
<section class="products">

  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Ear Mount</h3>
  </div>

  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>
  </div>

  <div class="product-card">
    <img src="Images/Tap To Pay Star.jpeg">
    <h3>Tap Star</h3>
  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

/* ================= THEME FIX (THIS WAS THE ISSUE) ================= */

document.getElementById("themeToggle").addEventListener("click", () => {
  document.body.classList.toggle("light-theme");
});

/* ================= LIGHTBOX ================= */

const lightbox=document.getElementById("lightbox");
const lightImg=document.getElementById("lightbox-img");

document.querySelectorAll(".product-card img").forEach(img=>{
  img.onclick=()=>{
    lightbox.style.display="flex";
    lightImg.src=img.src;
  };
});

lightbox.onclick=()=>lightbox.style.display="none";

</script>

</body>
</html>
