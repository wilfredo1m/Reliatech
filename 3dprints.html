<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>
:root {
  --bg-color:#000;
  --text-color:#fff;
  --card-bg:#111;
  --button-bg:#28a745;
  --button-hover:#1e7e34;
  --header-bg:#222;
  --dropdown-bg:#333;
}

.light-theme {
  --bg-color:#fff;
  --text-color:#000;
  --card-bg:#f4f4f4;
  --header-bg:#eee;
  --button-bg:#007bff;
  --button-hover:#0056b3;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
}

/* ================= HEADER (RESTORED) ================= */

header{
  background:var(--header-bg);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  z-index:1000;
  transition:.3s;
}

header.shrink{
  padding:.5rem 1rem;
}

.header-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.nav-section{
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo-link{
  color:var(--text-color);
  text-decoration:none;
  font-weight:bold;
}

.dropdown{
  position:relative;
  cursor:pointer;
}

.dropdown-content{
  display:none;
  position:absolute;
  background:var(--dropdown-bg);
  min-width:180px;
}

.dropdown:hover .dropdown-content{
  display:block;
}

.dropdown-content a{
  display:block;
  padding:10px;
  color:var(--text-color);
  text-decoration:none;
}

.dropdown-content a:hover{
  opacity:0.7;
}

.center-image img{
  height:70px;
  transition:.3s;
}

header.shrink .center-image img{
  height:45px;
}

#themeToggle{
  background:none;
  border:1px solid var(--text-color);
  color:var(--text-color);
  padding:.5rem 1rem;
  cursor:pointer;
}

/* ================= PAGE ================= */

.hero{
  text-align:center;
  padding:2rem 1rem;
}

/* GRID */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.5rem;
  padding:2rem;
  max-width:1200px;
  margin:auto;
}

/* CARD */
.product-card{
  background:var(--card-bg);
  border-radius:12px;
  overflow:hidden;
  text-align:center;
  padding-bottom:1rem;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-5px);
}

/* IMAGE FIX */
.product-card img{
  width:100%;
  height:240px;
  object-fit:contain;
  background:var(--card-bg);
  padding:10px;
  cursor:zoom-in;
}

/* TEXT */
.product-card p{
  font-size:.9rem;
  opacity:.85;
  padding:0 10px;
}

.price{
  font-weight:bold;
  margin:10px 0;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}

.qty{
  width:60px;
  text-align:center;
}

.order-btn{
  background:var(--button-bg);
  border:none;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.order-btn:hover{
  background:var(--button-hover);
}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.95);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:85%;
  object-fit:contain;
  cursor:zoom-in;
}

.lightbox img.zoomed{
  transform:scale(1.8);
}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- ================= HEADER RESTORED ================= -->
<header id="header">
  <div class="header-container">

    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>

      <div class="dropdown">
        <span>Service Types ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <a href="index.html">
        <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png">
      </a>
    </div>

    <div class="nav-section">
      <div class="dropdown">
        <span>More ▾</span>
        <div class="dropdown-content">
          <a href="about-us.html">About Us</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>

      <button id="themeToggle">Toggle Theme</button>
    </div>

  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <h1>3D Printing Services</h1>
  <p>Custom prints, fast turnaround, affordable pricing</p>
</section>

<!-- ================= PRODUCTS ================= -->
<section class="products">

  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Disney Ear Wall Mount</h3>
    <p>Wall mount for Disney ears.</p>
    <div class="price">$6</div>

    <div class="controls">
      <input class="qty" type="number" value="1" min="1">
      <button class="order-btn" data-name="Disney Ear Wall Mount">Order</button>
    </div>
  </div>

  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>
    <p>Custom backlit lithophane prints.</p>
    <div class="price">$60+</div>

    <div class="controls">
      <input class="qty" type="number" value="1" min="1">
      <button class="order-btn" data-name="Lithophane">Order</button>
    </div>
  </div>

</section>

<!-- ================= LIGHTBOX ================= -->
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>
  <img id="lightbox-img">
</div>

<script>

/* HEADER FUNCTIONALITY (RESTORED) */
document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('light-theme');
});

window.addEventListener('scroll', () => {
  document.getElementById('header')
    .classList.toggle('shrink', window.scrollY > 80);
});

/* LIGHTBOX */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

let images = [...document.querySelectorAll(".product-card img")];
let index = 0;

images.forEach((img,i)=>{
  img.addEventListener("click",()=>{
    index=i;
    lightbox.style.display="flex";
    lightboxImg.src=img.src;
  });
});

document.querySelector(".close").onclick=()=>{
  lightbox.style.display="none";
};

lightbox.onclick=(e)=>{
  if(e.target===lightbox) lightbox.style.display="none";
};

lightboxImg.onclick=()=>{
  lightboxImg.classList.toggle("zoomed");
};

/* SWIPE */
let startX=0;

lightbox.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

lightbox.addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;

  if(startX-endX>50 && index<images.length-1){
    index++;
    lightboxImg.src=images[index].src;
  }

  if(endX-startX>50 && index>0){
    index--;
    lightboxImg.src=images[index].src;
  }
});

/* ORDER BUTTON */
document.querySelectorAll(".order-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    let name=btn.dataset.name;
    let qty=btn.parentElement.querySelector(".qty").value;

    let formURL="YOUR_GOOGLE_FORM_LINK_HERE";

    window.open(formURL,"_blank");
  });
});

</script>

</body>
</html>
