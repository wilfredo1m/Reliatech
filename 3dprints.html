<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Printing Services</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#111;
  --btn:#28a745;
  --btnh:#1e7e34;
  --header:#222;
}

/* BASIC RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */

header{
  background:var(--header);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  z-index:1000;
  transition:.3s;
}

header.shrink{
  padding:.5rem 1rem;
}

.header-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:auto;
}

.nav-section{
  display:flex;
  align-items:center;
  gap:1rem;
}

.logo-link{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.dropdown{
  position:relative;
}

.dropdown-content{
  display:none;
  position:absolute;
  background:#333;
  min-width:180px;
}

.dropdown:hover .dropdown-content{
  display:block;
}

.dropdown-content a{
  display:block;
  padding:10px;
  color:white;
  text-decoration:none;
}

.center-image img{
  height:70px;
}

#themeToggle{
  background:none;
  border:1px solid white;
  color:white;
  padding:.5rem 1rem;
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:2rem;
}

/* ================= GRID ================= */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.5rem;
  padding:2rem;

  /* IMPORTANT FIX so cart doesn't overlap */
  padding-right:340px;
}

/* ================= CARD ================= */

.product-card{
  background:var(--card);
  border-radius:10px;
  text-align:center;
  padding-bottom:1rem;
  overflow:hidden;
}

.product-card img{
  width:100%;
  height:240px;
  object-fit:contain;
  background:#000;
  padding:10px;
  cursor:zoom-in;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.qty,.color{
  width:80px;
  padding:4px;
}

.order-btn{
  background:var(--btn);
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}

.order-btn:hover{
  background:var(--btnh);
}

/* ================= LIGHTBOX ================= */

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:85%;
  object-fit:contain;
}

.lightbox img.zoomed{
  transform:scale(1.8);
}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  cursor:pointer;
}

/* ================= CART ================= */

.cart{
  position:fixed;
  right:0;
  top:0;
  width:320px;
  height:100%;
  background:#111;
  padding:15px;
  overflow-y:auto;
  border-left:2px solid #333;
}

.cart-item{
  border-bottom:1px solid #333;
  padding:10px 0;
}

.cart-footer{
  position:absolute;
  bottom:20px;
  width:90%;
}

#checkoutBtn{
  width:100%;
  padding:10px;
  background:green;
  border:none;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- HEADER -->
<header id="header">
  <div class="header-container">

    <div class="nav-section">
      <a href="index.html" class="logo-link">Home</a>

      <div class="dropdown">
        <span>Services ▾</span>
        <div class="dropdown-content">
          <a href="Device-Services.HTML">Device Services</a>
          <a href="On-Site.HTML">On-Site Services</a>
          <a href="3dprints.html">3D Printing</a>
        </div>
      </div>
    </div>

    <div class="center-image">
      <img src="https://img1.wsimg.com/isteam/ip/882cb672-c9c5-4723-bab3-057ae57079f0/blob-f3ababb.png">
    </div>

    <div class="nav-section">
      <button id="themeToggle">Toggle Theme</button>
    </div>

  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>3D Printing Services</h1>
</section>

<!-- PRODUCTS -->
<section class="products">

  <!-- MOUNT -->
  <div class="product-card">
    <img src="Images/Disney Ear Wall Mount.jpeg">
    <h3>Disney Ear Wall Mount</h3>
    <p>Wall mount display.</p>

    <div class="controls">
      <input class="qty" type="number" value="1">

      <!-- COLOR -->
      <select class="color">
        <option>Red</option>
        <option>Blue</option>
        <option>White</option>
        <option>Black</option>
        <option>Yellow</option>
        <option>Green</option>
        <option>Pink</option>
        <option>Hot Pink</option>
        <option>Purple</option>
      </select>

      <button class="order-btn" data-name="Disney Ear Wall Mount" data-price="6">Add</button>
    </div>
  </div>

  <!-- LITHOPHANE (NO COLOR) -->
  <div class="product-card">
    <img src="Images/Lithophane.jpeg">
    <h3>Lithophane</h3>
    <p>Custom lithophane prints.</p>

    <div class="controls">
      <input class="qty" type="number" value="1">
      <button class="order-btn" data-name="Lithophane" data-price="60">Add</button>
    </div>
  </div>

  <!-- STAR -->
  <div class="product-card">
    <img src="Images/Tap To Pay Star.jpeg">
    <h3>Tap To Pay Star</h3>
    <p>Payment stand design.</p>

    <div class="controls">
      <input class="qty" type="number" value="1">

      <select class="color">
        <option>Red</option>
        <option>Blue</option>
        <option>White</option>
        <option>Black</option>
        <option>Yellow</option>
        <option>Green</option>
        <option>Pink</option>
        <option>Hot Pink</option>
        <option>Purple</option>
      </select>

      <button class="order-btn" data-name="Tap To Pay Star" data-price="10">Add</button>
    </div>
  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>
  <img id="lightbox-img">
</div>

<!-- CART -->
<div class="cart">
  <h3>Cart</h3>
  <div id="cart-items"></div>

  <div class="cart-footer">
    <p>Total: $<span id="total">0</span></p>
    <button id="checkoutBtn">Checkout</button>
  </div>
</div>

<script>

/* HEADER */
document.getElementById("themeToggle").onclick=()=>{
  document.body.classList.toggle("light-theme");
};

window.addEventListener("scroll",()=>{
  document.getElementById("header")
  .classList.toggle("shrink",window.scrollY>80);
});

/* LIGHTBOX */
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

let imgs=[...document.querySelectorAll(".product-card img")];
let index=0;

imgs.forEach((img,i)=>{
  img.onclick=()=>{
    index=i;
    lightbox.style.display="flex";
    lightboxImg.src=img.src;
  };
});

lightbox.onclick=(e)=>{
  if(e.target===lightbox) lightbox.style.display="none";
};

lightboxImg.onclick=()=>{
  lightboxImg.classList.toggle("zoomed");
};

/* CART */
let cart=[];

document.querySelectorAll(".order-btn").forEach(btn=>{
  btn.onclick=()=>{
    let name=btn.dataset.name;
    let price=parseFloat(btn.dataset.price);
    let qty=btn.parentElement.querySelector(".qty").value;
    let colorEl=btn.parentElement.querySelector(".color");

    let color=colorEl?colorEl.value:"N/A";

    cart.push({name,price,qty,color});
    updateCart();
  };
});

function updateCart(){
  let box=document.getElementById("cart-items");
  let total=0;

  box.innerHTML="";

  cart.forEach(c=>{
    let cost=c.price*c.qty;
    total+=cost;

    box.innerHTML+=`
      <div class="cart-item">
        <p>${c.name}</p>
        <p>Color: ${c.color}</p>
        <p>$${cost.toFixed(2)}</p>
      </div>
    `;
  });

  document.getElementById("total").innerText=total.toFixed(2);
}

/* CHECKOUT */
document.getElementById("checkoutBtn").onclick=()=>{
  alert("Next step: Stripe or Google Form checkout");
};

</script>

</body>
</html>
